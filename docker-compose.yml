services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vaultforge
      POSTGRES_USER: vaultforge
      POSTGRES_PASSWORD: vaultforge
    ports:
      - "5432:5432"
    volumes:
      - vaultforge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultforge -d vaultforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - vaultforge-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - vaultforge-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  vaultforge:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      VAULTFORGE_DB_URL: jdbc:postgresql://postgres:5432/vaultforge
      VAULTFORGE_DB_USER: vaultforge
      VAULTFORGE_DB_PASSWORD: vaultforge
      VAULTFORGE_REDIS_HOST: redis
      VAULTFORGE_RABBIT_HOST: rabbitmq
      VAULTFORGE_MINIO_ENDPOINT: http://minio:9000
      VAULTFORGE_MINIO_ACCESS_KEY: minioadmin
      VAULTFORGE_MINIO_SECRET_KEY: minioadmin
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  vaultforge-postgres:
  vaultforge-redis:
  vaultforge-minio:
